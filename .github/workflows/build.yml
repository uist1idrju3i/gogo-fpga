  e2e:
    name: Playwright E2E
    needs: [changes, build, synth, synth-native, synth-compare, nextpnr, nextpnr-compare, ghdl, pyodide-pack, surfer]
    if: needs.changes.outputs.build == 'true' && needs.build.result == 'success' && needs.synth.result == 'success' && needs.synth-native.result == 'success' && needs.synth-compare.result == 'success' && needs.nextpnr.result == 'success' && needs.nextpnr-compare.result == 'success' && needs.ghdl.result == 'success' && needs.pyodide-pack.result == 'success' && needs.surfer.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Web 配布物の組立に必要な submodule を取得
        run: |
          git submodule update --init --depth 1 -- vendor/zstd third_party/
          git -C third_party/vexriscv submodule update --init --depth 1 -- pythondata_cpu_vexriscv/verilog/ext/VexRiscv

      - name: Node.js を設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: npm 依存を取得
        run: npm ci

      - name: Chromium をインストール
        run: npx playwright install --with-deps chromium

      - name: CI ビルド成果物を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-build-${{ github.run_id }}
          path: build

      - name: Surfer WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-surfer-wasm-${{ github.run_id }}
          path: build/surfer/dist

      - name: WASI Yosys 成果物を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-yosys-synth-${{ github.run_id }}
          path: build/wasi/yosys

      - name: Native Yosys 成果物を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-yosys-native-${{ github.run_id }}
          path: build/native

      - name: Native Yosys の実行権限を復元
        run: chmod +x build/native/yosys build/native/yosys-abc

      - name: Icarus Verilog の比較用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-iverilog-${{ github.run_id }}
          path: build

      - name: nextpnr 成果物を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-nextpnr-${{ github.run_id }}
          path: build

      - name: Native nextpnr の実行権限を復元
        run: chmod +x build/native/nextpnr/nextpnr-himbaechel-gowin

      - name: WASI decoder のブラウザー用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-decoder-web-assets-${{ github.run_id }}
          path: build/wasi/decoders

      - name: GHDL WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-ghdl-wasm-${{ github.run_id }}
          path: build

      - name: Native GHDL の実行権限を復元
        run: chmod +x build/ghdl-native/bin/ghdl

      - name: Icarus Verilog WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-iverilog-web-assets-${{ github.run_id }}
          path: build/iverilog-wasm/output

      - name: Pyodide pack assets を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-pyodide-pack-${{ github.run_id }}
          path: build/pack

      - name: Native Apycula venv を作成
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv build/deps/apycula-venv
          build/deps/apycula-venv/bin/pip install --require-hashes -r requirements-nextpnr.txt

      - name: Playwright E2E
        env:
          BUILD_ROOT: build
          BUILD_INFO_CHECK: artifacts
        run: npx playwright test

      - name: E2E 失敗資料を保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gogo-fpga-web-test-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Playwright E2E
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi
