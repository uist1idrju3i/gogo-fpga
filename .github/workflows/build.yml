        if: steps.synth-native-output-cache-restore.outputs.cache-hit != 'true' && steps.synth-native-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.synth-native-output-cache-restore-key.outputs.key }}
          path: ${{ steps.synth-native-output-cache-restore-key.outputs.paths }}

  synth-compare:
    name: Yosys WASM/native comparison
    needs: [changes, synth, synth-native]
    if: needs.changes.outputs.build == 'true' && needs.synth.result == 'success' && needs.synth-native.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: WASI Yosys artifact を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-yosys-synth-${{ github.run_id }}
          path: build/wasi/yosys

      - name: Native Yosys artifact を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-yosys-native-${{ github.run_id }}
          path: build/native

      - name: Native Yosys の実行権限を設定
        run: chmod +x build/native/yosys build/native/yosys-abc

      - name: WASM/native 合成を比較
        run: node --test tests/synth/yosys.test.mjs

      - id: formal-sat
        name: Yosys SATの準備・前提・証明判定を比較
        run: node --test --test-concurrency=1 tests/synth/formal-sat.test.mjs

      - name: SAT比較の入力・ログ・反例を保存
        if: always() && steps.formal-sat.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-formal-sat-${{ github.run_id }}
          path: build/S15/p1-sat-*/
          if-no-files-found: error
          retention-days: 7

  nextpnr:
    name: nextpnr WASI place and route
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: nextpnr submodule を取得
        run: git submodule update --init --depth 1 -- vendor/nextpnr

      - name: Python venv をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv

      - name: Node.js を設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: nextpnr の整列パッチと負の対照を検証
        run: node --test tests/synth/nextpnr-control-set.test.mjs

      - id: output-cache-key
        name: nextpnr cache key
        env:
          COMPONENT: nextpnr
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: output-cache-lookup
        name: nextpnr cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.output-cache-key.outputs.paths }}
          key: ${{ steps.output-cache-key.outputs.key }}
          lookup-only: true

      - id: output-cache
        name: nextpnr cache restore
        if: steps.output-cache-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.output-cache-key.outputs.paths }}
          key: ${{ steps.output-cache-key.outputs.key }}
          fail-on-cache-miss: true

      - id: output-cache-check
        name: nextpnr cache integrity
        env:
          COMPONENT: nextpnr
          CACHE_KEY: ${{ steps.output-cache-key.outputs.key }}
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.output-cache-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: nextpnr-cache-restore-key
        name: nextpnr-inputs cache key
        env:
          COMPONENT: nextpnr-inputs
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: nextpnr-cache-restore-lookup
        name: nextpnr-inputs cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) && steps.output-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.nextpnr-cache-restore-key.outputs.paths }}
          key: ${{ steps.nextpnr-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: nextpnr-cache-restore
        name: nextpnr-inputs cache restore
        if: steps.nextpnr-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.nextpnr-cache-restore-key.outputs.paths }}
          key: ${{ steps.nextpnr-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: nextpnr-cache-restore-check
        name: nextpnr-inputs cache integrity
        env:
          COMPONENT: nextpnr-inputs
          CACHE_KEY: ${{ steps.nextpnr-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.nextpnr-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.nextpnr-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) && steps.output-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: nextpnr-wasi-build
        name: WASI nextpnr と chipdb をビルド
        env:
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
        if: steps.output-cache.outputs.cache-hit != 'true'
        run: |
          timing_dir="$GITHUB_WORKSPACE/build/timings"
          mkdir -p "$timing_dir"
          printf 'nextpnr build cache hit=%s\n' "${CACHE_HIT:-miss}"
          printf 'nproc='
          nproc
          free -g
          LC_ALL=C JOBS="$(nproc)" /usr/bin/time -v -o "$timing_dir/nextpnr-wasi.time.log" scripts/build-pnr-wasm.sh

      - name: native nextpnr をビルド
        env:
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
        if: steps.output-cache.outputs.cache-hit != 'true'
        run: |
          timing_dir="$GITHUB_WORKSPACE/build/timings"
          mkdir -p "$timing_dir"
          printf 'nextpnr build cache hit=%s\n' "${CACHE_HIT:-miss}"
          printf 'nproc='
          nproc
          free -g
          LC_ALL=C JOBS="$(nproc)" /usr/bin/time -v -o "$timing_dir/nextpnr-native.time.log" scripts/build-pnr-wasm.sh --native

      - name: nextpnr build resource summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            echo "Verified output cache hit; compilation and build resource measurement skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          report_time() {
            local label="$1"
            local log="$2"
            local wall rss
            if [[ ! -f "$log" ]]; then
              echo "Missing time log: $log" >&2
              return 1
            fi
            wall="$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss): //p' "$log" | tail -n 1)"
            rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$log" | tail -n 1)"
            if [[ -z "$wall" || -z "$rss" ]]; then
              echo "Incomplete time log: $log" >&2
              return 1
            fi
            printf '| %s | %s | %s |\n' "$label" "$wall" "$rss"
          }
          {
            echo '### nextpnr build resources'
            printf 'Build cache restore: %s\n\n' "${CACHE_HIT:-miss}"
            echo '| Build | Wall time | Max RSS (KiB) |'
            echo '|---|---:|---:|'
            report_time 'nextpnr WASI' "$GITHUB_WORKSPACE/build/timings/nextpnr-wasi.time.log"
            report_time 'nextpnr native' "$GITHUB_WORKSPACE/build/timings/nextpnr-native.time.log"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 成果物の SHA-256 を記録
        if: always()
        env:
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
        run: |
          hash_file() {
            local path="$1"
            local result digest
            if [[ -f "$path" ]]; then
              result="$(sha256sum -- "$path" 2>/dev/null)" || result=""
              digest="${result%% *}"
              if [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]]; then
                printf 'S8-SHA256 nextpnr %s %s\n' "$digest" "$path"
                return 0
              fi
            fi
            printf 'S8-SHA256 nextpnr MISSING %s\n' "$path"
          }
          {
            printf 'S8-CACHE nextpnr hit=%s integrity=verified-on-hit\n' "${CACHE_HIT:-false}"
            hash_file build/wasi/nextpnr/nextpnr-himbaechel-gowin.wasm
            hash_file build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW1N-9C.bin
            hash_file build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW1NS-4.bin
            hash_file build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW1NZ-1.bin
            hash_file build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW2A-18C.bin
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: nextpnr 成果物を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-nextpnr-${{ github.run_id }}
          path: |
            build/wasi/nextpnr/
            build/native/nextpnr/
          retention-days: 1

      - name: nextpnr のブラウザー用資材を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-nextpnr-web-assets-${{ github.run_id }}
          path: |
            build/wasi/nextpnr/nextpnr-himbaechel-gowin.wasm
            build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW1N-9C.bin
            build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW1NS-4.bin
            build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW1NZ-1.bin
            build/wasi/nextpnr/share/himbaechel/gowin/chipdb-GW2A-18C.bin
          if-no-files-found: error
          retention-days: 1

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: nextpnr WASI place and route
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: nextpnr-inputs cache manifest
        if: steps.nextpnr-cache-restore.outputs.cache-hit != 'true' && steps.nextpnr-wasi-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: nextpnr-inputs
          CACHE_KEY: ${{ steps.nextpnr-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: nextpnr-inputs cache save
        if: steps.nextpnr-cache-restore.outputs.cache-hit != 'true' && steps.nextpnr-wasi-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.nextpnr-cache-restore-key.outputs.key }}
          path: ${{ steps.nextpnr-cache-restore-key.outputs.paths }}

      - name: nextpnr cache manifest
        if: steps.output-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: nextpnr
          CACHE_KEY: ${{ steps.output-cache-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: nextpnr cache save
        if: steps.output-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.output-cache-key.outputs.key }}
          path: ${{ steps.output-cache-key.outputs.paths }}

  nextpnr-compare:
    name: nextpnr WASI/native comparison
    needs: [changes, synth, nextpnr]
