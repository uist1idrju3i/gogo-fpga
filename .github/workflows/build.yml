name: build

on:
  pull_request:
    branches-ignore: [pages, 'pages-update/**']
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      cache:
        description: Use verified build and download caches
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Check whether the build is needed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "push" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags origin \
              "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if ! git diff --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/changed-files"; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build=false
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/build.yml|.github/scripts/check-pins.py|RESEARCH.md|requirements-nextpnr.txt)
                build=true
                break
                ;;
              *.md|docs/*|.agents/*|.claude/*|.devin/*|vendor/yomiyasu|LICENSE|tests/check-*/*|.github/*)
                ;;
              *)
                build=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Changes
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    needs: [changes, synth, synth-compare, nextpnr, nextpnr-compare, ghdl, iverilog, surfer]
    if: needs.changes.outputs.build == 'true' && needs.synth.result == 'success' && needs.synth-compare.result == 'success' && needs.nextpnr.result == 'success' && needs.nextpnr-compare.result == 'success' && needs.ghdl.result == 'success' && needs.iverilog.result == 'success' && needs.surfer.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: 必要な submodule を取得
        run: |
          git submodule update --init --depth 1 -- \
            vendor/emsdk vendor/iverilog vendor/libftdi vendor/libusb vendor/openFPGALoader \
            vendor/yomiyasu vendor/zlib vendor/zstd vendor/yosys vendor/nextpnr vendor/surfer
          git submodule update --init --depth 1 -- third_party/
          git -C third_party/vexriscv submodule update --init --depth 1 -- pythondata_cpu_vexriscv/verilog/ext/VexRiscv
          git -C vendor/yosys submodule update --init --depth 1 -- \
            abc libs/cxxopts libs/fmt libs/tomlplusplus libs/boost_regex libs/symfpu

      - name: Autotools をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool
          autoconf --version | head -n 1
          automake --version | head -n 1
          libtoolize --version | head -n 1

      - name: Node.js を設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: npm 依存を取得
        run: npm ci

      - id: output-cache-key
        name: flasher cache key
        env:
          COMPONENT: flasher
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: output-cache-lookup
        name: flasher cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.output-cache-key.outputs.paths }}
          key: ${{ steps.output-cache-key.outputs.key }}
          lookup-only: true

      - id: output-cache
        name: flasher cache restore
        if: steps.output-cache-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.output-cache-key.outputs.paths }}
          key: ${{ steps.output-cache-key.outputs.key }}
          fail-on-cache-miss: true

      - id: output-cache-check
        name: flasher cache integrity
        env:
          COMPONENT: flasher
          CACHE_KEY: ${{ steps.output-cache-key.outputs.key }}
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.output-cache-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: emsdk-cache-restore-key
        name: emsdk cache key
        env:
          COMPONENT: emsdk
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: emsdk-cache-restore-lookup
        name: emsdk cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.emsdk-cache-restore-key.outputs.paths }}
          key: ${{ steps.emsdk-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: emsdk-cache-restore
        name: emsdk cache restore
        if: steps.emsdk-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.emsdk-cache-restore-key.outputs.paths }}
          key: ${{ steps.emsdk-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: emsdk-cache-restore-check
        name: emsdk cache integrity
        env:
          COMPONENT: emsdk
          CACHE_KEY: ${{ steps.emsdk-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.emsdk-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.emsdk-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: emsdk のタグを取得
        run: git -C vendor/emsdk fetch --depth=1 --tags origin

      - name: キャッシュのWASMと同じemsdkを有効化
        if: steps.output-cache.outputs.cache-hit == 'true'
        run: |
          version="$(git -C vendor/emsdk describe --tags --exact-match)"
          sdk="$GITHUB_WORKSPACE/build/emsdk-$version"
          if [[ ! -x "$sdk/emsdk" ]]; then
            mkdir -p "$sdk"
            git -C vendor/emsdk archive HEAD | tar -x -C "$sdk"
          fi
          "$sdk/emsdk" install "$version"
          "$sdk/emsdk" activate "$version"

      - id: wasm-build
        name: WASM をビルド
        if: steps.output-cache.outputs.cache-hit != 'true'
        run: scripts/build-wasm.sh

      - name: Icarus Verilog の比較用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-iverilog-${{ github.run_id }}
          path: build

      - name: WASI Yosys のブラウザー用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-yosys-web-assets-${{ github.run_id }}
          path: build/wasi/yosys

      - name: WASI nextpnr のブラウザー用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-nextpnr-web-assets-${{ github.run_id }}
          path: build/wasi/nextpnr

      - name: GHDL WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-ghdl-wasm-${{ github.run_id }}
          path: build

      - name: Icarus Verilog WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-iverilog-web-assets-${{ github.run_id }}
          path: build/iverilog-wasm/output

      - name: Surfer WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-surfer-wasm-${{ github.run_id }}
          path: build/surfer/dist

      - name: WASI decoder のブラウザー用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-decoder-web-assets-${{ github.run_id }}
          path: build/wasi/decoders

      - name: Web アプリを組み立て
        run: scripts/build-web.sh

      - id: fixture-cache-restore-key
        name: fixtures cache key
        env:
          COMPONENT: fixtures
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: fixture-cache-restore-lookup
        name: fixtures cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fixture-cache-restore-key.outputs.paths }}
          key: ${{ steps.fixture-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: fixture-cache-restore
        name: fixtures cache restore
        if: steps.fixture-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fixture-cache-restore-key.outputs.paths }}
          key: ${{ steps.fixture-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: fixture-cache-restore-check
        name: fixtures cache integrity
        env:
          COMPONENT: fixtures
          CACHE_KEY: ${{ steps.fixture-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.fixture-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.fixture-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: テスト用ビットストリームを生成
        id: fixture-build
        if: steps.fixture-cache-restore.outputs.cache-hit != 'true'
        run: tests/fixtures/build-fs.sh

      - name: fixture の SHA-256 を記録
        run: sha256sum build/fixtures/*.fs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Web 単体テスト
        run: node --test tests/web/*.test.mjs

      - name: Pages公開準備の回帰テスト
        run: python3 -m unittest discover -s tests/check-pages-publish

      - name: 成果物の SHA-256 を記録
        if: always()
        run: |
          hash_file() {
            local path="$1"
            local result digest
            if [[ -f "$path" ]]; then
              result="$(sha256sum -- "$path" 2>/dev/null)" || result=""
              digest="${result%% *}"
              if [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]]; then
                printf 'S8-SHA256 build %s %s\n' "$digest" "$path"
                return 0
              fi
            fi
            printf 'S8-SHA256 build MISSING %s\n' "$path"
          }
          {
            hash_file build/jspi-pthread/openFPGALoader.wasm
            hash_file build/jspi-pthread/openFPGALoader.mjs
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: CI ビルド成果物を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-build-${{ github.run_id }}
          path: |
            build/jspi-pthread/
            build/fixtures/*.fs
          retention-days: 1

      - name: Web 成果物を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gogo-fpga-web-${{ github.sha }}
          path: public_html/
          if-no-files-found: error
          retention-days: 30

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Build
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: emsdk cache manifest
        if: steps.emsdk-cache-restore.outputs.cache-hit != 'true' && steps.wasm-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: emsdk
          CACHE_KEY: ${{ steps.emsdk-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: emsdk cache save
        if: steps.emsdk-cache-restore.outputs.cache-hit != 'true' && steps.wasm-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.emsdk-cache-restore-key.outputs.key }}
          path: ${{ steps.emsdk-cache-restore-key.outputs.paths }}

      - name: fixtures cache manifest
        if: steps.fixture-cache-restore.outputs.cache-hit != 'true' && steps.fixture-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: fixtures
          CACHE_KEY: ${{ steps.fixture-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: fixtures cache save
        if: steps.fixture-cache-restore.outputs.cache-hit != 'true' && steps.fixture-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.fixture-cache-restore-key.outputs.key }}
          path: ${{ steps.fixture-cache-restore-key.outputs.paths }}

      - name: flasher cache manifest
        if: steps.output-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: flasher
          CACHE_KEY: ${{ steps.output-cache-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: flasher cache save
        if: steps.output-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.output-cache-key.outputs.key }}
          path: ${{ steps.output-cache-key.outputs.paths }}

  synth:
    name: Yosys WASI synthesis
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Yosys と必要な nested submodule を取得
        run: |
          git submodule update --init --depth 1 -- vendor/yosys
          git -C vendor/yosys submodule update --init --depth 1 -- \
            abc libs/cxxopts libs/fmt libs/tomlplusplus libs/boost_regex libs/symfpu

      - name: zstd と xz-embedded のソースを取得
        run: git submodule update --init --depth 1 -- vendor/zstd vendor/xz-embedded

      - name: ビルド依存をインストール
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex

      - name: Node.js を設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - id: synth-cache-restore-key
        name: synth-sdk cache key
        env:
          COMPONENT: synth-sdk
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: synth-cache-restore-lookup
        name: synth-sdk cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.synth-cache-restore-key.outputs.paths }}
          key: ${{ steps.synth-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: synth-cache-restore
        name: synth-sdk cache restore
        if: steps.synth-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.synth-cache-restore-key.outputs.paths }}
          key: ${{ steps.synth-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: synth-cache-restore-check
        name: synth-sdk cache integrity
        env:
          COMPONENT: synth-sdk
          CACHE_KEY: ${{ steps.synth-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.synth-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.synth-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: synth-wasi-output-cache-restore-key
        name: synth cache key
        env:
          COMPONENT: synth
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: synth-wasi-output-cache-restore-lookup
        name: synth cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.synth-wasi-output-cache-restore-key.outputs.paths }}
          key: ${{ steps.synth-wasi-output-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: synth-wasi-output-cache-restore
        name: synth cache restore
        if: steps.synth-wasi-output-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.synth-wasi-output-cache-restore-key.outputs.paths }}
          key: ${{ steps.synth-wasi-output-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: synth-wasi-output-cache-restore-check
        name: synth cache integrity
        env:
          COMPONENT: synth
          CACHE_KEY: ${{ steps.synth-wasi-output-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.synth-wasi-output-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.synth-wasi-output-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: synth-wasi-output-cache-check
        name: Yosys WASI cache artifact の整合性を確認
        if: steps.synth-wasi-output-cache-restore.outputs.cache-hit == 'true'
        run: |
          python3 scripts/build-synth-info.py \
            --check --mode wasi \
            --binary build/wasi/yosys/yosys.wasm \
            --output build/wasi/yosys/build-info.json
          test -d build/wasi/yosys/share
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Runner resources
        run: |
          printf 'nproc='
          nproc
          free -g

      - id: synth-wasi-build
        name: Yosys WASI 版をビルド
        if: steps.synth-wasi-output-cache-restore.outputs.cache-hit != 'true' || steps.synth-wasi-output-cache-check.outputs.valid != 'true'
        run: |
          timing_dir="$GITHUB_WORKSPACE/build/timings"
          mkdir -p "$timing_dir"
          printf 'nproc='
          nproc
          free -g
          LC_ALL=C JOBS="$(nproc)" /usr/bin/time -v -o "$timing_dir/yosys-wasi.time.log" scripts/build-synth-wasm.sh

      - id: decoder-cache-key
        name: decoders cache key
        env:
          COMPONENT: decoders
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: decoder-cache-lookup
        name: decoders cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.decoder-cache-key.outputs.paths }}
          key: ${{ steps.decoder-cache-key.outputs.key }}
          lookup-only: true

      - id: decoder-cache
        name: decoders cache restore
        if: steps.decoder-cache-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.decoder-cache-key.outputs.paths }}
          key: ${{ steps.decoder-cache-key.outputs.key }}
          fail-on-cache-miss: true

      - id: decoder-cache-check
        name: decoders cache integrity
        env:
          COMPONENT: decoders
          CACHE_KEY: ${{ steps.decoder-cache-key.outputs.key }}
          CACHE_HIT: ${{ steps.decoder-cache.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.decoder-cache-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: decoder-wasi-build
        name: 圧縮 decoder WASM をビルド
        if: steps.decoder-cache.outputs.cache-hit != 'true'
        run: scripts/build-decoders.sh

      - name: Yosys build resource summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.synth-wasi-build.outcome }}
          CACHE_HIT: ${{ steps.synth-wasi-output-cache-restore.outputs.cache-hit }}
          CACHE_VALID: ${{ steps.synth-wasi-output-cache-check.outputs.valid }}
        run: |
          log="$GITHUB_WORKSPACE/build/timings/yosys-wasi.time.log"
          {
            echo '### Yosys WASI build resources'
            if [[ "$BUILD_OUTCOME" == skipped && "$CACHE_HIT" == true && "$CACHE_VALID" == true ]]; then
              echo 'Valid output cache hit; build skipped.'
            elif [[ -f "$log" ]]; then
              wall="$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss): //p' "$log" | tail -n 1)"
              rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$log" | tail -n 1)"
              if [[ -z "$wall" || -z "$rss" ]]; then
                echo "Incomplete time log: $log" >&2
                exit 1
              fi
              printf '| Build | Wall time | Max RSS (KiB) |\n|---|---:|---:|\n| Yosys WASI | %s | %s |\n' "$wall" "$rss"
            else
              echo "Missing time log: $log" >&2
              exit 1
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 成果物の SHA-256 を記録
        if: always()
        env:
          CACHE_HIT: ${{ steps.synth-wasi-output-cache-restore.outputs.cache-hit }}
          CACHE_VALID: ${{ steps.synth-wasi-output-cache-check.outputs.valid }}
        run: |
          hash_file() {
            local job="$1"
            local path="$2"
            local result digest
            if [[ -f "$path" ]]; then
              result="$(sha256sum -- "$path" 2>/dev/null)" || result=""
              digest="${result%% *}"
              if [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]]; then
                printf 'S8-SHA256 %s %s %s\n' "$job" "$digest" "$path"
                return 0
              fi
            fi
            printf 'S8-SHA256 %s MISSING %s\n' "$job" "$path"
          }
          hash_tree() {
            local job="$1"
            local path="$2"
            local result line digest file
            if [[ -d "$path" ]]; then
              result="$(find "$path" -type f -print 2>/dev/null | LC_ALL=C sort | xargs -r sha256sum 2>/dev/null)" || result=""
              if [[ -n "$result" ]]; then
                while IFS= read -r line; do
                  digest="${line%% *}"
                  file="${line#*  }"
                  printf 'S8-SHA256 %s %s %s\n' "$job" "$digest" "$file"
                done <<< "$result"
                return 0
              fi
            fi
            printf 'S8-SHA256 %s MISSING %s\n' "$job" "$path"
          }
          shopt -s nullglob
          decoder_wasms=(build/wasi/decoders/*.wasm)
          {
            printf 'S8-CACHE synth hit=%s valid=%s\n' "${CACHE_HIT:-false}" "${CACHE_VALID:-not-checked}"
            hash_file synth build/wasi/yosys/yosys.wasm
            hash_tree synth build/wasi/yosys/share
            hash_file synth build/wasi/yosys/build-info.json
            if ((${#decoder_wasms[@]})); then
              for path in "${decoder_wasms[@]}"; do
                hash_file synth "$path"
              done
            else
              printf 'S8-SHA256 synth MISSING build/wasi/decoders/*.wasm\n'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: 合成成果物を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-yosys-synth-${{ github.run_id }}
          path: |
            build/wasi/yosys/yosys.wasm
            build/wasi/yosys/share/
            build/wasi/yosys/build-info.json
          retention-days: 1

      - name: Yosys のブラウザー用資材を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-yosys-web-assets-${{ github.run_id }}
          path: |
            build/wasi/yosys/yosys.wasm
            build/wasi/yosys/share/
          if-no-files-found: error
          retention-days: 1

      - name: WASI decoder のブラウザー用資材を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-decoder-web-assets-${{ github.run_id }}
          path: build/wasi/decoders/*.wasm
          if-no-files-found: error
          retention-days: 1

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Yosys WASI synthesis
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: synth-sdk cache manifest
        if: steps.synth-cache-restore.outputs.cache-hit != 'true' && steps.synth-wasi-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: synth-sdk
          CACHE_KEY: ${{ steps.synth-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: synth-sdk cache save
        if: steps.synth-cache-restore.outputs.cache-hit != 'true' && steps.synth-wasi-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.synth-cache-restore-key.outputs.key }}
          path: ${{ steps.synth-cache-restore-key.outputs.paths }}

      - name: synth cache manifest
        if: steps.synth-wasi-output-cache-restore.outputs.cache-hit != 'true' && steps.synth-wasi-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: synth
          CACHE_KEY: ${{ steps.synth-wasi-output-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: synth cache save
        if: steps.synth-wasi-output-cache-restore.outputs.cache-hit != 'true' && steps.synth-wasi-build.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.synth-wasi-output-cache-restore-key.outputs.key }}
          path: ${{ steps.synth-wasi-output-cache-restore-key.outputs.paths }}

      - name: decoders cache manifest
        if: steps.decoder-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
