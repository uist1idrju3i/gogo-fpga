        with:
          persist-credentials: false

      - name: シミュレーション結果を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sim-shard-*
          path: sim-results

      - name: shard の網羅性を検査
