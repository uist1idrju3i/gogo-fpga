        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.iverilog-cache-restore-key.outputs.paths }}
          key: ${{ steps.iverilog-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: iverilog-cache-restore-check
        name: iverilog-inputs cache integrity
        env:
          COMPONENT: iverilog-inputs
          CACHE_KEY: ${{ steps.iverilog-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.iverilog-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.iverilog-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) && steps.output-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

