          name: ci-nextpnr-${{ github.run_id }}
          path: build

      - name: GHDL WASM 資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-ghdl-wasm-${{ github.run_id }}
          path: build

      - name: Icarus Verilog の比較用資材を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-iverilog-${{ github.run_id }}
          path: build

      - name: Icarus Verilog native 版の実行権限を設定
        run: |
          chmod +x build/iverilog-native/output/ivlpp build/iverilog-native/output/ivl build/iverilog-native/output/vvp
          chmod +x build/native/yosys build/native/yosys-abc build/native/nextpnr/nextpnr-himbaechel-gowin
          chmod +x build/ghdl-native/bin/ghdl

      - id: formal-vhdl
        name: VHDLとPSLの性質をGHDLとYosysで照合
        if: matrix.suite == 'hdl'
        run: node --test --test-concurrency=1 tests/synth/formal-vhdl.test.mjs tests/synth/ghdl-replay.test.mjs tests/synth/ghdl-lowered-replay.test.mjs tests/synth/formal-vhdl-lowered.test.mjs

      - name: VHDL形式検証の入力・一覧・反例・CSVを保存
        if: always() && steps.formal-vhdl.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-formal-vhdl-${{ github.run_id }}
          path: build/S15/p1-vhdl-*/
          if-no-files-found: error
          retention-days: 7

      - id: formal-replay
        name: 元のVerilogでSAT反例を独立に再実行
        if: matrix.suite == 'hdl'
        run: node --test --test-concurrency=1 tests/synth/formal-replay.test.mjs

      - name: 独立再実行の入力・VCD・ログ・CSVを保存
        if: always() && steps.formal-replay.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-formal-replay-${{ github.run_id }}
          path: build/S15/p1-replay-*/
          if-no-files-found: error
          retention-days: 7

      - id: pack-cache-restore-key
        name: pack-inputs cache key
        env:
          COMPONENT: pack-inputs
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: pack-cache-restore-lookup
        name: pack-inputs cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pack-cache-restore-key.outputs.paths }}
          key: ${{ steps.pack-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: pack-cache-restore
        name: pack-inputs cache restore
        if: steps.pack-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pack-cache-restore-key.outputs.paths }}
          key: ${{ steps.pack-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: pack-cache-restore-check
        name: pack-inputs cache integrity
        env:
          COMPONENT: pack-inputs
          CACHE_KEY: ${{ steps.pack-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.pack-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.pack-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Native Apycula venv を作成
        run: |
          python3 -m venv build/deps/apycula-venv
          build/deps/apycula-venv/bin/pip install --require-hashes -r requirements-nextpnr.txt

      - id: pack-assets
        name: Pyodide pack assets を検証
        run: scripts/build-pack-assets.sh

      - id: pack-parity
        name: Native / Pyodide gowin_pack parity
        env:
          PACK_SUITE: ${{ matrix.suite }}
        run: |
          if [[ "$PACK_SUITE" == cpu ]]; then
            node --test --test-name-pattern '^pinned CPU libraries retain execution and classify all four board builds' tests/synth/gowin-pack.test.mjs
          else
            node --test --test-skip-pattern '^pinned CPU libraries retain execution and classify all four board builds' tests/synth/gowin-pack.test.mjs tests/synth/library-components.test.mjs tests/synth/yosys-parity.test.mjs tests/synth/library-measurements.test.mjs
          fi

      - name: 合成・配置配線・packの失敗した入力とログを保存
        if: always() && steps.pack-parity.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-library-flow-failure-${{ matrix.suite }}-${{ github.run_id }}
          path: build/t5-library-flow-*/
          if-no-files-found: error
          retention-days: 7

      - name: Pyodide pack assets を保存
        if: matrix.suite == 'hdl'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-pyodide-pack-${{ github.run_id }}
          path: build/pack/
          retention-days: 1

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Pyodide gowin_pack (${{ matrix.suite }})
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: pack-inputs cache manifest
        if: steps.pack-cache-restore.outputs.cache-hit != 'true' && steps.pack-assets.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: pack-inputs
          CACHE_KEY: ${{ steps.pack-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: pack-inputs cache save
        if: steps.pack-cache-restore.outputs.cache-hit != 'true' && steps.pack-assets.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.pack-cache-restore-key.outputs.key }}
          path: ${{ steps.pack-cache-restore-key.outputs.paths }}

  sim:
    name: Simulation shard ${{ matrix.shard }}
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Node.js を設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: CI ビルド成果物を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-build-${{ github.run_id }}
          path: build

      - name: 仮想 USB シミュレーション
        env:
          SIM_SHARD: ${{ matrix.shard }}/3
          WASM_BUILD_ROOT: build
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=sim-shard.tap tests/sim/*.test.mjs

      - name: シミュレーション結果を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-shard-${{ matrix.shard }}
          path: sim-shard.tap
          if-no-files-found: ignore
          retention-days: 1

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: Simulation shard ${{ matrix.shard }}
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

  sim-coverage:
    name: Simulation shard coverage
    needs: [build, sim]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
