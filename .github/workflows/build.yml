      - name: Icarus Verilog の比較用資材を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-iverilog-${{ github.run_id }}
          path: |
            build/iverilog-wasm/output/
            build/iverilog-native/output/
            build/iverilog-wasm/build-info.json
            build/iverilog-native/build-info.json
          if-no-files-found: error
          retention-days: 1

      - name: iverilog-inputs cache manifest
        if: steps.iverilog-cache-restore.outputs.cache-hit != 'true' && steps.iverilog-build.outcome == 'success' && steps.iverilog-tests.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
