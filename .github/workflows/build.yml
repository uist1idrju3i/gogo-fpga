  ghdl:
    name: GHDL WASM synthesis
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: GHDL submodule を取得
        run: |
          git submodule update --init --depth 1 -- vendor/ghdl third_party/
          git -C third_party/vexriscv submodule update --init --depth 1 -- pythondata_cpu_vexriscv/verilog/ext/VexRiscv

      - name: GNAT を確認
        run: |
          if ! command -v gnatmake >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gnat
          fi
          gnatmake --version | head -n 1

      - name: Node.js を設定
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: npm 依存を取得
        run: npm ci

      - id: output-cache-key
        name: ghdl cache key
        env:
          COMPONENT: ghdl
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: output-cache-lookup
        name: ghdl cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.output-cache-key.outputs.paths }}
          key: ${{ steps.output-cache-key.outputs.key }}
          lookup-only: true

      - id: output-cache
        name: ghdl cache restore
        if: steps.output-cache-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.output-cache-key.outputs.paths }}
          key: ${{ steps.output-cache-key.outputs.key }}
          fail-on-cache-miss: true

      - id: output-cache-check
        name: ghdl cache integrity
        env:
          COMPONENT: ghdl
          CACHE_KEY: ${{ steps.output-cache-key.outputs.key }}
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.output-cache-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - id: ghdl-cache-restore-key
        name: ghdl-inputs cache key
        env:
          COMPONENT: ghdl-inputs
        run: python3 scripts/ci-build-cache.py key "$COMPONENT" >> "$GITHUB_OUTPUT"

      - id: ghdl-cache-restore-lookup
        name: ghdl-inputs cache lookup
        if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) && steps.output-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ghdl-cache-restore-key.outputs.paths }}
          key: ${{ steps.ghdl-cache-restore-key.outputs.key }}
          lookup-only: true

      - id: ghdl-cache-restore
        name: ghdl-inputs cache restore
        if: steps.ghdl-cache-restore-lookup.outputs.cache-hit == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.ghdl-cache-restore-key.outputs.paths }}
          key: ${{ steps.ghdl-cache-restore-key.outputs.key }}
          fail-on-cache-miss: true

      - id: ghdl-cache-restore-check
        name: ghdl-inputs cache integrity
        env:
          COMPONENT: ghdl-inputs
          CACHE_KEY: ${{ steps.ghdl-cache-restore-key.outputs.key }}
          CACHE_HIT: ${{ steps.ghdl-cache-restore.outputs.cache-hit }}
          EXPECTED_HIT: ${{ steps.ghdl-cache-restore-lookup.outputs.cache-hit }}
          ENABLED: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.cache) && steps.output-cache.outputs.cache-hit != 'true' }}
        run: |
          if [[ "$EXPECTED_HIT" == true && "$CACHE_HIT" != true ]]; then
            echo "Cache restore failed after an exact lookup hit" >&2
            exit 1
          fi
          state=miss
          if [[ "$ENABLED" != true ]]; then state=disabled; fi
          if [[ "$CACHE_HIT" == true ]]; then
            python3 scripts/ci-build-cache.py check "$COMPONENT" --key "$CACHE_KEY"
            state=verified-hit
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'Cache %s: %s (%s)\n' "$COMPONENT" "$state" "$CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Pinned WASI SDK 34 を取得
        if: steps.output-cache.outputs.cache-hit != 'true'
        run: |
          pin="$(python3 .github/scripts/check-pins.py wasi-sdk-pin)"
          IFS=$'\t' read -r version sha asset url <<< "$pin"
          if [[ -z "$version" || -z "$sha" || -z "$asset" || -z "$url" ]]; then
            echo "WASI SDK pin is incomplete." >&2
            exit 1
          fi
          sdk_dir="build/${asset%.tar.gz}"
          archive="build/cache/ghdl-wasm/$asset"
          mkdir -p "$(dirname "$archive")"
          if [[ ! -f "$archive" ]]; then
            curl --fail --location --retry 3 --output "$archive.tmp" "$url"
            mv "$archive.tmp" "$archive"
          fi
          printf '%s  %s\n' "$sha" "$archive" | sha256sum --check
          if [[ ! -x "$sdk_dir/bin/clang" || ! -x "$sdk_dir/bin/wasm-ld" ||
            ! -x "$sdk_dir/bin/llvm-ar" || ! -x "$sdk_dir/bin/llvm-strip" ]]; then
            tar -xzf "$archive" -C build
          fi
          for tool in clang wasm-ld llvm-ar llvm-strip; do
            if [[ ! -x "$sdk_dir/bin/$tool" ]]; then
              printf 'Required WASI SDK tool is missing: %s/bin/%s\n' "$sdk_dir" "$tool" >&2
              exit 1
            fi
          done

      - id: ghdl-build
        name: GHDL WASM と native 版をビルド
        if: steps.output-cache.outputs.cache-hit != 'true'
        run: |
          timing_dir="$GITHUB_WORKSPACE/build/timings"
          mkdir -p "$timing_dir"
          printf 'nproc='
          nproc
          free -g
          LC_ALL=C JOBS="$(nproc)" /usr/bin/time -v -o "$timing_dir/ghdl.time.log" scripts/build-ghdl-wasm.sh

      - name: GHDL build resource summary
        if: always()
        env:
          CACHE_HIT: ${{ steps.output-cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            echo "Verified output cache hit; compilation and build resource measurement skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          log="$GITHUB_WORKSPACE/build/timings/ghdl.time.log"
          wall="$(sed -n 's/^[[:space:]]*Elapsed (wall clock) time (h:mm:ss or m:ss): //p' "$log" 2>/dev/null | tail -n 1)"
          rss="$(sed -n 's/^[[:space:]]*Maximum resident set size (kbytes): //p' "$log" 2>/dev/null | tail -n 1)"
          if [[ -z "$wall" || -z "$rss" ]]; then
            echo "Missing or incomplete time log: $log" >&2
            exit 1
          fi
          {
            echo '### GHDL build resources'
            printf 'Build input cache restore: %s\n\n' "${CACHE_HIT:-miss}"
            printf '| Build | Wall time | Max RSS (KiB) |\n|---|---:|---:|\n| GHDL WASM and native | %s | %s |\n' "$wall" "$rss"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - id: ghdl-tests
        name: WASM/native VHDL 合成を比較
        run: node --test tests/synth/ghdl-wasm.test.mjs

      - name: 成果物の SHA-256 を記録
        if: always()
        run: |
          hash_tree() {
            local job="$1"
            local path="$2"
            local result line digest file
            if [[ -d "$path" ]]; then
              result="$(find "$path" -type f -print 2>/dev/null | LC_ALL=C sort | xargs -r sha256sum 2>/dev/null)" || result=""
              if [[ -n "$result" ]]; then
                while IFS= read -r line; do
                  digest="${line%% *}"
                  file="${line#*  }"
                  printf 'S8-SHA256 %s %s %s\n' "$job" "$digest" "$file"
                done <<< "$result"
                return 0
              fi
            fi
            printf 'S8-SHA256 %s MISSING %s\n' "$job" "$path"
          }
          {
            hash_tree ghdl build/ghdl-wasm
            hash_tree ghdl build/ghdl-native
          } | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: GHDL WASM 成果物を保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-ghdl-wasm-${{ github.run_id }}
          path: |
            build/ghdl-wasm/
            build/ghdl-native/
          if-no-files-found: error
          retention-days: 1

      - name: Summarize step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_DISPLAY_NAME: GHDL WASM synthesis
        run: |
          step_lines="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" --paginate --jq '
            .jobs[] | select(.name == env.JOB_DISPLAY_NAME) | .steps[] |
            select(.completed_at != null) |
            [.number, .name, (if .started_at == null then "unknown" else ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) end), .conclusion] |
            @tsv
          ' 2>/dev/null)" || step_lines=""
          if [[ -n "$step_lines" ]]; then
            {
              printf '| # | Step | Seconds | Conclusion |\n|---:|---|---:|---|\n'
              printf '%s\n' "$step_lines" | awk -F '\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Step timings unavailable (unknown)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ghdl-inputs cache manifest
        if: steps.ghdl-cache-restore.outputs.cache-hit != 'true' && steps.ghdl-build.outcome == 'success' && steps.ghdl-tests.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: ghdl-inputs
          CACHE_KEY: ${{ steps.ghdl-cache-restore-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: ghdl-inputs cache save
        if: steps.ghdl-cache-restore.outputs.cache-hit != 'true' && steps.ghdl-build.outcome == 'success' && steps.ghdl-tests.outcome == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ghdl-cache-restore-key.outputs.key }}
          path: ${{ steps.ghdl-cache-restore-key.outputs.paths }}

      - name: ghdl cache manifest
        if: steps.output-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          COMPONENT: ghdl
          CACHE_KEY: ${{ steps.output-cache-key.outputs.key }}
        run: python3 scripts/ci-build-cache.py seal "$COMPONENT" --key "$CACHE_KEY"

      - name: ghdl cache save
        if: steps.output-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.output-cache-key.outputs.key }}
          path: ${{ steps.output-cache-key.outputs.paths }}

  iverilog:
    name: Icarus Verilog WASI build and comparison
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-26.04
